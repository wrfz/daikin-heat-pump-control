# Daikin bridge firmware (can). Copy this file next to your ESPHome
# configuration, adjust the substitutions and add your own components below if
# needed. The component and the packages come from the same version of the
# repository (`bridge_ref`: a branch or a release tag), so they always match.
substitutions:
  name: daikin-can
  friendly_name: Daikin CAN Bridge
  project_name: wrfz.daikin_can_bridge
  board: esp32-s3-devkitc-1
  api_key: !secret daikin_api_key
  ota_password: !secret daikin_ota_password
  can_tx_pin: GPIO5
  can_rx_pin: GPIO6
  bridge_ref: main

external_components:
  - source:
      type: git
      url: https://github.com/wrfz/daikin-heat-pump-control
      ref: ${bridge_ref}
      path: esphome/components
    components: [daikin_bridge]
    refresh: 1d

packages:
  daikin_bridge:
    url: https://github.com/wrfz/daikin-heat-pump-control
    ref: ${bridge_ref}
    refresh: 1d
    files:
      - esphome/packages/board-esp32.yaml
      - esphome/packages/bridge-core.yaml
      - esphome/packages/can-esp32.yaml
      - esphome/packages/bridge-can.yaml
