# Bridge component and the actions every bridge offers. Board independent.
daikin_bridge:
  id: daikin_bridge_id

api:
  actions:
    - action: daikin_bridge_info
      supports_response: only
      then:
        - api.respond:
            data: !lambda "id(daikin_bridge_id).info(root);"
    - action: daikin_bridge_claim
      supports_response: only
      variables:
        client: string
      then:
        - api.respond:
            data: !lambda "id(daikin_bridge_id).claim(client, root);"
