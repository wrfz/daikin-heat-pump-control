# CAN part of the bridge. Expects a canbus with the id `daikin_can`.
daikin_bridge:
  can:
    canbus_id: daikin_can

api:
  actions:
    - action: daikin_can_exchange
      supports_response: only
      variables:
        client: string
        frames: string[]
      then:
        - api.respond:
            data: !lambda "id(daikin_bridge_id).can_exchange(client, frames, root);"
