# Daikin bridge firmware (uart). Copy this file and the packages folder next to
# your ESPHome configuration, adjust the substitutions and add your own
# components below if needed.
substitutions:
  name: daikin-uart
  friendly_name: Daikin UART Bridge
  project_name: wrfz.daikin_uart_bridge
  board: esp32-s3-devkitc-1
  api_key: !secret daikin_api_key
  ota_password: !secret daikin_ota_password
  uart_tx_pin: GPIO1
  uart_rx_pin: GPIO2

external_components:
  - source:
      type: git
      url: https://github.com/wrfz/DaikinHeatPumpControl
      ref: main
      path: esphome/components
    components: [daikin_bridge]
    refresh: 1d
  # For a local checkout use instead:
  # - source:
  #     type: local
  #     path: components
  #   components: [daikin_bridge]

packages:
  board: !include packages/board-esp32.yaml
  core: !include packages/bridge-core.yaml
  uart_hw: !include packages/uart-esp32.yaml
  bridge_uart: !include packages/bridge-uart.yaml
