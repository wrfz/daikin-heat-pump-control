repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy -p custom_components.daikin_heat_pump_control
        language: system
        types: [python]
        pass_filenames: false
      - id: translations
        name: translations match strings.json
        entry: python3 -c "import json,sys; d='custom_components/daikin_heat_pump_control/'; a=json.load(open(d+'strings.json')); b=json.load(open(d+'translations/en.json')); sys.exit(a != b)"
        language: system
        files: ^custom_components/daikin_heat_pump_control/(strings\.json|translations/en\.json)$
        pass_filenames: false
