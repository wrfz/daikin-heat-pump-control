name: Release

# The Marketplace installs a release straight from the repository; nothing is
# built or uploaded. A pushed tag is checked against the version in
# manifest.json, which Home Assistant shows as installed version, and a draft
# release with generated notes is created for it. For an existing tag the
# workflow can be started by hand.

on:
  push:
    tags: ["[0-9]*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to check and draft a release for
        required: true

jobs:
  version:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches manifest version
        run: |
          python3 - <<'PY'
          import json, os, sys
          tag = os.environ["TAG"].removeprefix("v")
          manifest = json.load(open("custom_components/daikin_heat_pump_control/manifest.json"))
          if manifest["version"] != tag:
              sys.exit(f"Tag {tag} does not match manifest version {manifest['version']}")
          print(f"Version {tag} ok")
          PY

  draft:
    needs: version
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Draft release with generated notes
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists already"
            exit 0
          fi
          gh release create "$TAG" --draft --title "$TAG" --generate-notes --verify-tag
