name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set version
        run: |
          python - <<'PY'
          import json, os
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          manifest = json.load(open("manifest.json"))
          manifest["version"] = version
          json.dump(manifest, open("manifest.json", "w"), indent=2)
          PY
      - name: Build zip
        run: python scripts/build_zip.py --output dist/daikin_heat_pump_control.zip
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/daikin_heat_pump_control.zip
