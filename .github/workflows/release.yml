name: Release

# The Marketplace installs a release straight from the repository; nothing is
# built or uploaded. This only checks that the tag matches the version in
# manifest.json, which Home Assistant shows as installed version.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches manifest version
        run: |
          python3 - <<'PY'
          import json, os, sys
          ref = os.environ["GITHUB_REF_NAME"]
          tag = ref.removeprefix("v")
          manifest = json.load(open("custom_components/daikin_heat_pump_control/manifest.json"))
          if manifest["version"] != tag:
              sys.exit(f"Tag {ref} does not match manifest version {manifest['version']}")
          print(f"Version {tag} ok")
          PY
