name: CI

# One run per push or pull request with all checks as parallel jobs. The weekly
# run notices changes of the HACS and hassfest checks without a push.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.14"
          activate-environment: true
      - name: Install
        run: uv pip install -r requirements_test.txt
      - name: Ruff
        run: uv run --no-project ruff check . && uv run --no-project ruff format --check .
      - name: Mypy
        run: uv run --no-project mypy -p custom_components.daikin_heat_pump_control
      - name: Translations
        run: |
          uv run --no-project python - <<'PY'
          import json, sys
          base = "custom_components/daikin_heat_pump_control/"
          strings = json.load(open(base + "strings.json"))
          english = json.load(open(base + "translations/en.json"))
          sys.exit("translations/en.json differs from strings.json" if strings != english else 0)
          PY
      - name: Pytest
        run: uv run --no-project pytest --cov --timeout 60 -m "not e2e"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: repo
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.14"
          activate-environment: true
      - name: Fetch hassfest of the minimum Home Assistant version
        run: |
          mkdir core
          curl -sL https://codeload.github.com/home-assistant/core/tar.gz/refs/tags/2026.11.3 \
            | tar xz -C core --strip-components=1 core-2026.11.3/script core-2026.11.3/packages
          # Extra packages as in the hassfest image of Home Assistant.
          uv pip install homeassistant==2026.11.3 tqdm ruff
      - name: Hassfest
        working-directory: core
        run: >-
          PYTHONPATH=packages/hassfest ../.venv/bin/python -m script.hassfest
          --integration-path ../repo/custom_components/daikin_heat_pump_control

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend-src/.nvmrc
          cache: npm
          cache-dependency-path: frontend-src/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Build is checked in
        working-directory: .
        run: |
          git status --porcelain custom_components/daikin_heat_pump_control/frontend
          git diff --exit-code custom_components/daikin_heat_pump_control/frontend
          test -z "$(git status --porcelain custom_components/daikin_heat_pump_control/frontend)"

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands: icon not submitted yet; information: README follows in part 6.
          ignore: brands information
