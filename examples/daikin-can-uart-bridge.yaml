# Daikin bridge firmware (CAN and UART). Copy this file next to your ESPHome
# configuration and adjust the values marked with "Adjust". Your own components
# (sensors, relays, ...) can be added at the end. The API actions of the bridge
# come with the component; do not declare them yourself.
esphome:
  name: daikin-can-uart  # Adjust: node name
  friendly_name: Daikin CAN UART Bridge  # Adjust

esp32:
  board: esp32-s3-devkitc-1  # Adjust: your board
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret daikin_api_key

ota:
  - platform: esphome
    password: !secret daikin_ota_password

external_components:
  - source:
      type: git
      url: https://github.com/wrfz/daikin-heat-pump-control
      # A branch or a release tag, e.g. 2026.11.2 for a fixed version.
      ref: main
      path: esphome/components
    components: [daikin_bridge]
    refresh: 1d

# CAN transceiver at the RoCon controller, 20 kbit/s.
canbus:
  - platform: esp32_can
    id: daikin_can
    tx_pin: GPIO5  # Adjust
    rx_pin: GPIO6  # Adjust
    can_id: 0x680
    bit_rate: 20kbps

# X10A connector of the indoor unit, 9600 8E1.
uart:
  - id: daikin_uart
    tx_pin: GPIO1  # Adjust
    rx_pin: GPIO2  # Adjust
    baud_rate: 9600
    data_bits: 8
    parity: EVEN
    stop_bits: 1

daikin_bridge:
  can:
    canbus_id: daikin_can
    # buffer_size: 256      # received frames kept per bus
    # send_queue_size: 16   # frames waiting to be sent
    # quiet_time: 250ms     # bus quiet before a frame is sent
  uart:
    uart_id: daikin_uart
    # buffer_size: 1024     # received bytes kept
